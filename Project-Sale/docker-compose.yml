services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=SaleDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=SuperSecretKeyForSaleApp1234567890!!
      - Jwt__Issuer=SaleApp
      - Jwt__Audience=SaleAppUsers
    ports:
      - "8080:8080"

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
